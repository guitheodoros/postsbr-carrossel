<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PostSBR v.2</title>
<script>
(function(){
  try {
    var t = localStorage.getItem("mesa-de-carrossel:theme");
    if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
  } catch(e){}
})();
</script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,900;1,9..144,500&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Geist:wght@700&family=Roboto:wdth,wght@87.5,900;100,400&family=Instrument+Serif:ital@1&display=swap">
<style>
  :root{
    color-scheme: light dark;
    --paper:#EFEDE6;
    --paper-2:#E4E1D6;
    --ink:#17161B;
    --ink-soft:#6B6960;
    --line: rgba(23,22,27,0.16);
    --accent:#FF4B2E;
    --accent-ink:#FFF6F2;
    --radius:6px;
    --shadow: 0 1px 2px rgba(23,22,27,0.10), 0 8px 24px rgba(23,22,27,0.10);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#18171C;
      --paper-2:#221F26;
      --ink:#EEEAE1;
      --ink-soft:#9B978C;
      --line: rgba(238,234,225,0.14);
      --accent:#FF6A44;
      --accent-ink:#1B0D08;
      --shadow: 0 1px 2px rgba(0,0,0,0.5), 0 8px 24px rgba(0,0,0,0.35);
    }
  }
  :root[data-theme="dark"]{
    --paper:#18171C;
    --paper-2:#221F26;
    --ink:#EEEAE1;
    --ink-soft:#9B978C;
    --line: rgba(238,234,225,0.14);
    --accent:#FF6A44;
    --accent-ink:#1B0D08;
    --shadow: 0 1px 2px rgba(0,0,0,0.5), 0 8px 24px rgba(0,0,0,0.35);
  }

  *{ box-sizing:border-box; }
  body{
    margin:0; background:var(--paper); color:var(--ink);
    font-family:'IBM Plex Sans',system-ui,sans-serif;
    background-image:
      repeating-linear-gradient(0deg, var(--line) 0 1px, transparent 1px 44px),
      repeating-linear-gradient(90deg, var(--line) 0 1px, transparent 1px 44px);
    background-size:44px 44px; background-attachment:local;
    background-blend-mode:normal;
  }
  body{ background-image:none; } /* keep grid subtle-off by default, toggled below */
  .app{ max-width:1360px; margin:0 auto; padding:30px 32px 70px; }

  .header{ position:relative; display:flex; align-items:flex-end; justify-content:space-between; gap:24px;
    margin-bottom:26px; padding-bottom:20px; padding-right:150px; border-bottom:1px solid var(--line); flex-wrap:wrap; }
  .brand-row{ display:flex; align-items:center; gap:10px; }
  .brand-title{ font-family:'Geist',sans-serif; font-weight:700; font-size:28px; letter-spacing:-0.01em; margin:0; }
  .brand-title .beta-tag{ color:#4c00ff; font-size:13px; font-weight:600; letter-spacing:0.02em; vertical-align:middle; }
  .theme-toggle{ position:relative; display:inline-flex; align-items:center; width:40px; height:18px;
    border:1px solid var(--line); border-radius:999px; background:var(--paper-2); cursor:pointer;
    flex-shrink:0; padding:0; }
  .theme-toggle:hover{ border-color:var(--accent); }
  .theme-toggle:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
  .theme-toggle .track-icon{ position:absolute; top:50%; transform:translateY(-50%); width:10px; height:10px;
    color:var(--ink-soft); pointer-events:none; }
  .theme-toggle .icon-sun{ left:3px; }
  .theme-toggle .icon-moon{ right:3px; }
  .theme-toggle .theme-thumb{ position:absolute; top:1px; left:2px; width:14px; height:14px; border-radius:50%;
    background:var(--ink); box-shadow:var(--shadow); transition:transform .18s ease, background .18s ease; }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]) .theme-toggle .theme-thumb{ transform:translateX(20px); background:var(--accent); }
  }
  :root[data-theme="dark"] .theme-toggle .theme-thumb{ transform:translateX(20px); background:var(--accent); }
  :root[data-theme="light"] .theme-toggle .theme-thumb{ transform:translateX(0); background:var(--ink); }
  .subtitle{ color:var(--ink-soft); font-size:13.5px; margin-top:5px; max-width:46ch; }
  .header-controls{ display:flex; gap:22px; align-items:flex-start; flex-wrap:wrap; }
  .new-carrossel-btn{ position:absolute; top:0; right:0; }

  .field{ display:flex; flex-direction:column; gap:5px; }
  .field label{ font-size:10.5px; text-transform:uppercase; letter-spacing:.08em; color:var(--ink-soft); font-weight:600; }
  .field-row{ display:flex; gap:8px; align-items:center; }
  .check{ display:flex; align-items:center; gap:6px; font-size:12px; color:var(--ink-soft); }
  .check input{ accent-color:var(--accent); }

  input[type=text], textarea, select{
    font-family:'IBM Plex Sans'; border:1px solid var(--line); background:var(--paper-2);
    color:var(--ink); border-radius:4px; padding:7px 9px; font-size:13px; }
  textarea{ resize:vertical; min-height:52px; line-height:1.45; width:100%; }
  input[type=text]{ width:100%; }
  input[type=color]{ padding:2px; width:38px; height:32px; border:1px solid var(--line); border-radius:4px; background:var(--paper-2); cursor:pointer; }
  input[type=range]{ accent-color:var(--accent); }
  select{ cursor:pointer; }

  .seg{ display:flex; border:1px solid var(--line); border-radius:var(--radius); overflow:hidden; }
  .seg button{ padding:8px 15px; font:500 13px 'IBM Plex Sans'; background:var(--paper-2); color:var(--ink); border:none; cursor:pointer; }
  .seg button.active{ background:var(--ink); color:var(--paper); }
  .seg button:focus-visible{ outline:2px solid var(--accent); outline-offset:-2px; }

  .layout{ display:flex; flex-direction:column; gap:22px; }

  .filmstrip-head{ display:flex; justify-content:space-between; align-items:baseline; }
  .filmstrip-head h2{ font-family:'Fraunces'; font-size:15px; font-weight:600; margin:0; }
  .count{ font-family:'IBM Plex Mono'; font-size:11px; color:var(--ink-soft); }
  .thumbs-row{ display:flex; align-items:flex-start; gap:14px; }
  .thumbs{ display:flex; flex-direction:row; gap:10px; overflow-x:auto; padding-bottom:6px; flex:1; }
  .thumb{ position:relative; border:1.5px solid var(--line); border-radius:7px; padding:6px; cursor:pointer;
    background:var(--paper-2); transition:border-color .15s; width:132px; flex-shrink:0; }
  .thumb.active{ border-color:var(--accent); }
  .thumb canvas{ display:block; width:100%; height:auto; border-radius:3px; }
  .thumb-controls{ display:flex; justify-content:space-between; margin-top:6px; opacity:0; transition:opacity .15s; }
  .thumb:hover .thumb-controls, .thumb.active .thumb-controls{ opacity:1; }
  .thumb-controls button{ background:none; border:none; color:var(--ink-soft); font-size:12px; cursor:pointer; padding:2px 3px; font-family:'IBM Plex Mono'; }
  .thumb-controls button:hover:not(:disabled){ color:var(--ink); }
  .thumb-controls button:disabled{ opacity:.3; cursor:not-allowed; }

  .media-pool{ display:flex; flex-wrap:wrap; gap:8px; margin-top:8px; }
  .media-pool:empty{ display:none; }
  .media-pool-item{ position:relative; width:56px; height:56px; border-radius:5px; overflow:hidden;
    border:1.5px solid var(--line); cursor:pointer; flex-shrink:0; background:var(--paper-2); }
  .media-pool-item.active{ border-color:var(--accent); }
  .media-pool-item img{ display:block; width:100%; height:100%; object-fit:cover; }
  .media-pool-item button{ position:absolute; top:1px; right:1px; width:16px; height:16px; line-height:14px;
    border:none; border-radius:3px; background:rgba(23,22,27,0.7); color:#fff; font-size:11px; cursor:pointer;
    padding:0; opacity:0; transition:opacity .15s; }
  .media-pool-item:hover button{ opacity:1; }
  .thumb-index{ position:absolute; top:8px; left:8px; font-family:'IBM Plex Mono'; font-size:10px;
    background:rgba(0,0,0,.6); color:#fff; padding:1px 5px; border-radius:3px; letter-spacing:.02em; }
  .add-slide{ border:1.5px dashed var(--line); border-radius:7px; padding:13px 18px; text-align:center; font-size:12.5px;
    color:var(--ink-soft); background:none; cursor:pointer; font-family:'IBM Plex Sans'; white-space:nowrap; flex-shrink:0; }
  .add-slide:hover{ border-color:var(--accent); color:var(--accent); }

  .workspace{ display:grid; grid-template-columns:1fr 1fr; gap:32px; align-items:start; }
  .preview-col{ display:flex; flex-direction:column; align-items:center; gap:14px; min-width:0; max-width:520px; justify-self:center;
    position:sticky; top:20px; }
  .phone-wrap{ position:relative; width:100%; }
  .phone{ width:100%; border-radius:26px; padding:9px; background:#0e0d10; box-shadow:var(--shadow); }
  .phone canvas{ display:block; width:100%; height:auto; border-radius:17px; background:#111; touch-action:none; }
  .crop-hint{ position:absolute; left:50%; bottom:34px; transform:translateX(-50%);
    background:rgba(0,0,0,.65); color:#fff; font-family:'IBM Plex Mono'; font-size:10.5px;
    padding:5px 10px; border-radius:12px; pointer-events:none; letter-spacing:.02em; white-space:nowrap; }
  .phone-nav{ position:absolute; top:50%; transform:translateY(-50%); background:var(--paper);
    border:1px solid var(--line); width:30px; height:30px; border-radius:50%; cursor:pointer; font-size:13px; color:var(--ink); }
  .phone-nav.prev{ left:-15px; } .phone-nav.next{ right:-15px; }
  .phone-nav:hover{ border-color:var(--accent); color:var(--accent); }
  .dots{ display:flex; gap:6px; }
  .dot{ width:6px; height:6px; border-radius:50%; background:var(--line); cursor:pointer; border:none; padding:0; }
  .dot.active{ background:var(--accent); width:18px; border-radius:3px; }
  .readout{ font-family:'IBM Plex Mono'; font-size:11px; color:var(--ink-soft); text-align:center; }

  .editor-col{ min-width:0; display:flex; flex-direction:column; gap:20px;
    background:var(--paper-2); border:1px solid var(--line); border-radius:9px; padding:22px 24px;
    position:sticky; top:20px; max-height:calc(100vh - 40px); overflow-y:auto; }
  .editor-head{ display:flex; justify-content:space-between; align-items:baseline; }
  .editor-head h3{ font-family:'Fraunces'; font-size:17px; font-weight:600; margin:0; }
  .role-tag{ font-family:'IBM Plex Mono'; font-size:10.5px; text-transform:uppercase; letter-spacing:.08em;
    padding:3px 8px; border-radius:3px; background:var(--ink); color:var(--paper); }
  .grid2{ display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  .grid3{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:14px; }
  .divider{ border-top:1px solid var(--line); margin:2px 0; }
  .section-label{ font-family:'IBM Plex Mono'; font-size:10.5px; text-transform:uppercase; letter-spacing:.09em; color:var(--ink-soft); }

  .btn{ font-family:'IBM Plex Sans'; font-weight:600; font-size:13px; padding:10px 16px; border-radius:5px;
    border:1px solid var(--line); background:var(--paper); color:var(--ink); cursor:pointer; }
  .btn:hover:not(:disabled){ border-color:var(--ink-soft); }
  .btn.primary{ background:var(--accent); color:var(--accent-ink); border-color:var(--accent); }
  .btn.primary:hover:not(:disabled){ filter:brightness(1.05); }
  .btn.btn-white{ background:#ffffff; color:#17161b; border-color:#ffffff; }
  .btn.btn-white:hover:not(:disabled){ filter:brightness(0.95); }
  .btn:disabled{ opacity:.45; cursor:not-allowed; }
  .btn:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible{ outline:2px solid var(--accent); outline-offset:1px; }
  .export-row{ display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
  .export-note{ font-family:'IBM Plex Mono'; font-size:11px; color:var(--ink-soft); }

  .toast{ position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(16px);
    background:var(--ink); color:var(--paper); padding:10px 18px; border-radius:6px; font-size:13px;
    opacity:0; transition:all .22s ease; pointer-events:none; z-index:20; }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  .modal-overlay{ position:fixed; inset:0; background:rgba(10,9,11,.55); display:flex;
    align-items:center; justify-content:center; z-index:30; opacity:0; pointer-events:none;
    transition:opacity .15s ease; }
  .modal-overlay.show{ opacity:1; pointer-events:auto; }
  .modal-box{ background:var(--paper); border:1px solid var(--line); border-radius:9px;
    box-shadow:var(--shadow); padding:22px 24px; width:320px; max-width:calc(100vw - 40px);
    transform:translateY(6px) scale(.98); transition:transform .15s ease; }
  .modal-overlay.show .modal-box{ transform:translateY(0) scale(1); }
  .modal-box p{ margin:0 0 18px; font-size:13.5px; line-height:1.5; color:var(--ink); }
  .modal-actions{ display:flex; justify-content:flex-end; gap:8px; }

  @media (max-width:820px){
    .thumb{ width:100px; }
    .workspace{ grid-template-columns:1fr; }
    .preview-col{ max-width:none; position:static; }
    .editor-col{ position:static; max-height:none; overflow-y:visible; }
  }
</style>
<script src="https://unpkg.com/@ffmpeg/util@0.12.1/dist/umd/index.js"></script>
<script src="https://unpkg.com/@ffmpeg/ffmpeg@0.12.10/dist/umd/ffmpeg.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
</head>
<body>

<div class="app">
  <header class="header">
    <div class="brand-row">
      <h1 class="brand-title">PostSBR <span class="beta-tag">v.2</span></h1>
      <button class="theme-toggle" id="themeToggle" type="button" role="switch" aria-checked="false" title="Alternar modo claro/escuro" aria-label="Alternar modo claro/escuro">
        <svg class="track-icon icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
        <svg class="track-icon icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
        <span class="theme-thumb"></span>
      </button>
    </div>
    <div class="header-controls">
      <div class="field">
        <label for="projectName">Projeto</label>
        <input type="text" id="projectName" value="carrossel-de-carrossel">
        <span class="export-note" id="saveStatus">rascunho local</span>
      </div>
      <div class="field">
        <label>Formato</label>
        <div class="seg" id="formatSeg">
          <button data-format="4:5" class="active">4:5</button>
          <button data-format="1:1">1:1</button>
        </div>
      </div>
      <div class="field">
        <label for="slideCountSel">Slides</label>
        <select id="slideCountSel">
          <option value="2">2</option>
          <option value="3">3</option>
          <option value="4">4</option>
          <option value="5" selected>5</option>
          <option value="6">6</option>
          <option value="7">7</option>
          <option value="8">8</option>
          <option value="9">9</option>
          <option value="10">10</option>
          <option value="11">11</option>
          <option value="12">12</option>
          <option value="13">13</option>
          <option value="14">14</option>
          <option value="15">15</option>
          <option value="16">16</option>
          <option value="17">17</option>
          <option value="18">18</option>
          <option value="19">19</option>
          <option value="20">20</option>
        </select>
      </div>
      <div class="field">
        <label for="handleInput">Perfil</label>
        <input type="text" id="handleInput" value="@suamarca" style="width:130px">
      </div>
      <div class="field">
        <label for="accentInput">Destaque</label>
        <input type="color" id="accentInput" value="#ff4b2e">
      </div>
      <div class="field">
        <label for="logoSelect">Logo</label>
        <select id="logoSelect">
          <option value="none">Nenhum</option>
          <option value="auto" selected>Automático</option>
          <option value="preto">SneakersBR — preto (fixo)</option>
          <option value="branco">SneakersBR — branco (fixo)</option>
        </select>
      </div>
      <div class="field">
        <label for="logoPosSel">Posição do logo</label>
        <select id="logoPosSel">
          <option value="left">Esquerda</option>
          <option value="center">Centro</option>
          <option value="right">Direita</option>
        </select>
      </div>
      <div class="field">
        <label>&nbsp;</label>
        <div style="display:flex; gap:12px;">
          <span class="check"><input type="checkbox" id="showLogo" checked> exibir logo</span>
          <span class="check"><input type="checkbox" id="showHandle" checked> exibir @</span>
          <span class="check"><input type="checkbox" id="showPageNum" checked> numeração</span>
        </div>
      </div>
    </div>
    <button class="btn btn-white new-carrossel-btn" id="resetBtn" type="button" title="Apaga o rascunho salvo e recomeça do exemplo">Novo carrossel</button>
  </header>

  <div class="layout">
    <div class="filmstrip-head">
      <h2>Sequência</h2>
      <span class="count" id="slideCount">5 slides</span>
    </div>
    <div class="thumbs-row">
      <div class="thumbs" id="thumbs"></div>
      <button class="add-slide" id="addSlide">+ novo slide</button>
    </div>

    <section class="workspace">
      <div class="preview-col">
        <div class="phone-wrap">
          <div class="phone"><canvas id="mainCanvas"></canvas></div>
          <div class="crop-hint" id="cropHint" style="display:none;">⤡ arraste para reposicionar</div>
          <button class="phone-nav prev" id="prevSlide" aria-label="Slide anterior">‹</button>
          <button class="phone-nav next" id="nextSlide" aria-label="Próximo slide">›</button>
        </div>
        <div class="dots" id="dots"></div>
        <div class="readout" id="dimsReadout">1080 × 1350 · slide 1/5</div>
      </div>

      <div class="editor-col">
        <div class="editor-head">
          <h3 id="editorTitle">Slide 1</h3>
          <div style="display:flex; align-items:center; gap:12px;">
            <span class="check"><input type="checkbox" id="slideShowLogo" checked> logo neste slide</span>
            <span class="role-tag" id="roleTag">capa</span>
          </div>
        </div>

        <div class="grid2">
          <div class="field">
            <label for="valignSel">Alinhamento vertical</label>
            <select id="valignSel">
              <option value="top">Topo</option>
              <option value="center">Centro</option>
              <option value="bottom">Base</option>
            </select>
          </div>
          <div class="field">
            <label for="halignSel">Alinhamento horizontal</label>
            <select id="halignSel">
              <option value="left">Esquerda</option>
              <option value="center">Centro</option>
            </select>
          </div>
        </div>

        <div class="field">
          <label for="eyebrowInput">Rótulo (opcional)</label>
          <div style="display:flex; gap:8px; align-items:center;">
            <input type="text" id="eyebrowInput" placeholder="Ex.: SALVE PARA DEPOIS" style="flex:1;">
            <input type="color" id="eyebrowColorInput" title="Cor do rótulo" value="#ff4b2e">
          </div>
        </div>
        <div class="field">
          <label for="headlineInput">Título</label>
          <textarea id="headlineInput" rows="2"></textarea>
          <div style="display:flex; align-items:center; gap:8px; margin-top:2px;">
            <input type="range" id="headlineSize" min="80" max="140" step="1" value="84" style="flex:1;">
            <span class="export-note" id="headlineSizeValue" style="min-width:34px;">84px</span>
            <button class="btn" id="resetHeadlineSize" type="button" title="Restaurar tamanho padrão" style="padding:6px 10px; font-size:11px;">padrão</button>
          </div>
        </div>
        <div class="field">
          <label for="bodyInput">Texto</label>
          <textarea id="bodyInput" rows="3"></textarea>
          <div style="display:flex; align-items:center; gap:8px; margin-top:2px;">
            <input type="range" id="bodySize" min="30" max="45" step="1" value="30" style="flex:1;">
            <span class="export-note" id="bodySizeValue" style="min-width:34px;">30px</span>
            <button class="btn" id="resetBodySize" type="button" title="Restaurar tamanho padrão" style="padding:6px 10px; font-size:11px;">padrão</button>
          </div>
        </div>

        <div class="divider"></div>
        <span class="section-label">Fundo</span>
        <div class="grid3">
          <div class="field">
            <label for="bgType">Tipo</label>
            <select id="bgType">
              <option value="solid">Sólido</option>
              <option value="gradient">Gradiente</option>
              <option value="image">Imagem</option>
              <option value="video">Vídeo</option>
            </select>
          </div>
          <div class="field" id="color1Field">
            <label for="bgColor1">Cor 1</label>
            <input type="color" id="bgColor1" value="#17161b">
          </div>
          <div class="field" id="color2Field" style="display:none">
            <label for="bgColor2">Cor 2</label>
            <input type="color" id="bgColor2" value="#ff4b2e">
          </div>
        </div>
        <div class="field" id="imageField" style="display:none">
          <label for="bgImage">Carregar imagem(ns)</label>
          <input type="text" id="bgImageName" readonly placeholder="Nenhuma imagem" style="display:none">
          <input type="file" id="bgImage" accept="image/*" multiple>
          <div class="media-pool" id="mediaPool"></div>
        </div>
        <div class="field" id="videoField" style="display:none">

  // ---- IndexedDB key-value store (draft storage — much higher quota than localStorage) ----
  const IDB_NAME = "mesa-de-carrossel";
  const IDB_STORE = "kv";
  function idbOpen(){
    return new Promise((resolve, reject) => {
      if (!window.indexedDB) { reject(new Error("IndexedDB indisponível")); return; }
      const req = indexedDB.open(IDB_NAME, 1);
      req.onupgradeneeded = () => { req.result.createObjectStore(IDB_STORE); };
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  }
  async function idbGet(key){
    const db = await idbOpen();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(IDB_STORE, "readonly");
      const req = tx.objectStore(IDB_STORE).get(key);
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  }
  async function idbSet(key, value){
    const db = await idbOpen();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(IDB_STORE, "readwrite");
      tx.objectStore(IDB_STORE).put(value, key);
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error);
    });
  }
  async function idbDelete(key){
    const db = await idbOpen();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(IDB_STORE, "readwrite");
      tx.objectStore(IDB_STORE).delete(key);
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error);
    });
  }

  function compressImageFile(file, maxDim, quality){
    maxDim = maxDim || 1350; quality = quality != null ? quality : 0.82;
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onerror = () => reject(reader.error || new Error("Falha ao ler o arquivo"));
      reader.onload = () => {
        const original = new Image();
        original.onerror = () => reject(new Error("Não foi possível ler a imagem"));
        original.onload = () => {
          const scale = Math.min(1, maxDim / Math.max(original.width, original.height));
          const w = Math.max(1, Math.round(original.width * scale));
          const h = Math.max(1, Math.round(original.height * scale));
          const canvas = document.createElement("canvas");
          canvas.width = w; canvas.height = h;
          canvas.getContext("2d").drawImage(original, 0, 0, w, h);
          const dataUrl = canvas.toDataURL("image/jpeg", quality);
          const compressed = new Image();
          compressed.onload = () => resolve({ dataUrl, img: compressed });
          compressed.onerror = () => reject(new Error("Falha ao gerar a versão comprimida"));
          compressed.src = dataUrl;
        };
        original.src = reader.result;
      };
      reader.readAsDataURL(file);
    });
  }

    const attr = document.documentElement.getAttribute("data-theme");
    if (attr === "light" || attr === "dark") return attr;

    try { localStorage.setItem(THEME_KEY, next); } catch(e){}
  });

      $("saveStatus").textContent = "salvo às " + hh + ":" + mm;
      $("saveStatus").style.color = "";
    } catch(e){
      $("saveStatus").textContent = "não foi possível salvar (armazenamento cheio)";
      $("saveStatus").style.color = "var(--accent)";
    }
  }

  // one-time migration for drafts saved before the switch to IndexedDB
  function migrateLegacyLocalStorageDraft(){
    let raw;
    try { raw = localStorage.getItem(STORAGE_KEY); } catch(e){ return null; }
    if (!raw) return null;
    try {
      const parsed = JSON.parse(raw);
      if (parsed) {
        idbSet(STORAGE_KEY, parsed).catch(() => {});
        try { localStorage.removeItem(STORAGE_KEY); } catch(e){}
      }
      return parsed;
    } catch(e){ return null; }
  }

  async function loadDraft(){
    let parsed;
    try { parsed = await idbGet(STORAGE_KEY); } catch(e){ parsed = null; }
    if (!parsed) parsed = migrateLegacyLocalStorageDraft();
    if (!parsed || !Array.isArray(parsed.slides) || parsed.slides.length === 0) return null;
    parsed.mediaPool = (Array.isArray(parsed.mediaPool) ? parsed.mediaPool : []).map(p => {
      const img = new Image();
      img.onload = () => scheduleRender();
      img.src = p.dataUrl;
      return { id: p.id, name: p.name, dataUrl: p.dataUrl, img };
    });
    let hadVideo = false;
    parsed.slides = parsed.slides.map(raw => {
      const s = slide(raw);
      s.bg = Object.assign({ type:"solid", color1:"#17161b", color2:"#ff4b2e", image:null, img:null, imageOverlay:40, cropX:0.5, cropY:0.5, zoom:1,
        videoUrl:null, videoEl:null, videoName:null, poolId:null }, raw.bg);
      if (s.bg.type === "image" && s.bg.image){
        const img = new Image();
        img.onload = () => scheduleRender();
        img.src = s.bg.image;
        s.bg.img = img;
      } else {
        s.bg.img = null;
      }
      if (s.bg.type === "video"){
        // video files aren't kept in the saved draft (too large to persist); needs a re-upload
        hadVideo = true;
        s.bg.type = "solid";
        s.bg.videoUrl = null; s.bg.videoEl = null; s.bg.videoName = null;
      }
      return s;
    });
    parsed._hadVideo = hadVideo;
    return parsed;
  }

  async function clearDraft(){
    try { await idbDelete(STORAGE_KEY); } catch(e){}
  }

  function confirmDialog(message){
    const overlay = $("confirmOverlay");
    $("confirmMessage").textContent = message;
    overlay.classList.add("show");
    return new Promise(resolve => {
      function cleanup(result){
        overlay.classList.remove("show");
        okBtn.removeEventListener("click", onOk);
        cancelBtn.removeEventListener("click", onCancel);
        overlay.removeEventListener("click", onOverlay);
        document.removeEventListener("keydown", onKey);
        resolve(result);
      }
      const okBtn = $("confirmOk"), cancelBtn = $("confirmCancel");
      function onOk(){ cleanup(true); }
      function onCancel(){ cleanup(false); }
      function onOverlay(e){ if (e.target === overlay) cleanup(false); }
      function onKey(e){ if (e.key === "Escape") cleanup(false); }
      okBtn.addEventListener("click", onOk);
      cancelBtn.addEventListener("click", onCancel);
      overlay.addEventListener("click", onOverlay);
      document.addEventListener("keydown", onKey);
    });
  }

  function dims(){ return state.format === "1:1" ? [1080,1080] : [1080,1350]; }
  function selectedIndex(){ return state.slides.findIndex(s => s.id === state.selectedId); }
  function selectedSlide(){ return state.slides[selectedIndex()]; }

  function wrapAndFit(ctx, text, opts){
    const { weight, family, maxWidth, maxHeight, startSize, minSize, lineHeightRatio, variation, maxLines } = opts;
    const paragraphs = String(text || "").split("\n");
    let size = startSize, lines = [], lineHeight = 0;
    while (size >= minSize){
      ctx.font = weight + " " + size + "px '" + family + "'";
      try { ctx.fontVariationSettings = variation || "normal"; } catch(e){}
      lines = [];
      for (const p of paragraphs){
        if (p === ""){ lines.push(""); continue; }
        const words = p.split(" ");
        let cur = "";
        for (const w of words){
          const test = cur ? cur + " " + w : w;
          if (ctx.measureText(test).width > maxWidth && cur){ lines.push(cur); cur = w; }
          else cur = test;
        }
        lines.push(cur);
      }
      lineHeight = size * lineHeightRatio;
      const fitsHeight = lines.length * lineHeight <= maxHeight;
      const fitsLines = !maxLines || lines.length <= maxLines;
      if ((fitsHeight && fitsLines) || size <= minSize) break;
      size -= 2;
    }
    if (maxLines && lines.length > maxLines){
      lines = lines.slice(0, maxLines);
      let last = lines[maxLines-1];
      while (last.length && ctx.measureText(last + "…").width > maxWidth){
        last = last.slice(0, -1);
      }
      lines[maxLines-1] = last.replace(/\s+$/,"") + "…";
    }
    return { size, lines, lineHeight };
  }

  function drawSlide(ctx, s, brand, W, H, index, total){
    ctx.clearRect(0,0,W,H);
    ctx.textBaseline = "top";

    // background
    if (s.bg.type === "solid"){
      ctx.fillStyle = s.bg.color1; ctx.fillRect(0,0,W,H);
    } else if (s.bg.type === "gradient"){
      const g = ctx.createLinearGradient(0,0,W,H);
      g.addColorStop(0, s.bg.color1); g.addColorStop(1, s.bg.color2);
      ctx.fillStyle = g; ctx.fillRect(0,0,W,H);
    } else if (s.bg.type === "image" || s.bg.type === "video"){
      ctx.fillStyle = s.bg.color1; ctx.fillRect(0,0,W,H);
      const isVideo = s.bg.type === "video";
      const media = isVideo ? s.bg.videoEl : s.bg.img;
      const mediaReady = isVideo
        ? (media && media.readyState >= 2 && media.videoWidth)
        : (media && media.complete && media.naturalWidth);
      if (mediaReady){
        const iw = isVideo ? media.videoWidth : media.naturalWidth;
        const ih = isVideo ? media.videoHeight : media.naturalHeight;
        const zoom = s.bg.zoom != null ? s.bg.zoom : 1;
        const scale = Math.max(W/iw, H/ih) * zoom;
        const dw = iw*scale, dh = ih*scale;
        const cropX = s.bg.cropX != null ? s.bg.cropX : 0.5;
        const cropY = s.bg.cropY != null ? s.bg.cropY : 0.5;
        ctx.drawImage(media, (W-dw)*cropX, (H-dh)*cropY, dw, dh);
      }
      const overlayAlpha = (s.bg.imageOverlay != null ? s.bg.imageOverlay : 40) / 100;
      if (overlayAlpha > 0){
        ctx.fillStyle = "rgba(0,0,0," + overlayAlpha + ")";
        ctx.fillRect(0,0,W,H);
      }
    }

    const pad = Math.round(W*0.09);
    const boxTop = pad, boxBottom = H - pad, boxLeft = pad, boxWidth = W - pad*2;
    const gap = Math.round(W*0.025);

    // logo (pinned to the top of every slide, text flows below it)
    let contentTop = boxTop;
    let logoImg = null;
    if (brand.showLogo && s.showLogo !== false && brand.logo && brand.logo.mode !== "none"){
      const variant = brand.logo.mode === "auto" ? (isDarkBg(s) ? "branco" : "preto") : brand.logo.mode;
      logoImg = brand.logo.imgs && brand.logo.imgs[variant];
    }
    if (logoImg && logoImg.complete && logoImg.naturalWidth){
      const ratio = logoImg.naturalWidth / logoImg.naturalHeight;
      const maxLogoW = boxWidth*0.55;
      let logoW = Math.min(Math.round(W*0.1625), maxLogoW);
      let logoH = logoW/ratio;
      let logoX = boxLeft;
      if (brand.logoPos === "center") logoX = boxLeft + (boxWidth-logoW)/2;
      else if (brand.logoPos === "right") logoX = boxLeft+boxWidth-logoW;
      ctx.drawImage(logoImg, logoX, boxTop, logoW, logoH);
      contentTop = boxTop + logoH + gap*2.1;
    }

    // footer (watermark / page number) reserves space so "base" alignment never sits on top of it
    let contentBottom = boxBottom;
    if ((brand.showHandle && brand.handle) || brand.showPageNum){
      contentBottom = boxBottom - Math.round(W*0.066);
    }
    const boxHeight = contentBottom - contentTop;

    ctx.fillStyle = s.textColor;
    try { ctx.letterSpacing = "0.14em"; } catch(e){}

    let eyebrowH = 0;
    const eyebrowSize = Math.round(W*0.026);
    if (s.eyebrow){
      ctx.font = "700 " + eyebrowSize + "px 'Geist'";
      eyebrowH = eyebrowSize*1.3;
    }
    try { ctx.letterSpacing = "0px"; } catch(e){}

    const isContentSlide = index > 0 && index < total - 1;
    const headlineBudget = boxHeight*0.62 - eyebrowH;
    const headlineStartSize = Math.round((s.headlineSize || 84) * (W/1080));
    const headlineFit = wrapAndFit(ctx, s.headline, {
      weight:"900", family:"Roboto", variation:'"wdth" 87.5', maxWidth:boxWidth, maxHeight:Math.max(headlineBudget, W*0.08),
      startSize:headlineStartSize, minSize:Math.min(Math.round(W*0.032), headlineStartSize), lineHeightRatio:1.12,
      maxLines: isContentSlide ? 2 : 3
    });
    const headlineH = headlineFit.lines.length * headlineFit.lineHeight;

    const usedSoFar = eyebrowH + (eyebrowH?gap:0) + headlineH + gap;
    const bodyBudget = Math.max(boxHeight - usedSoFar, W*0.05);
    const bodyStartSize = Math.round((s.bodySize || 30) * (W/1080));
    const bodyFit = wrapAndFit(ctx, s.body, {
      weight:"400", family:"Roboto", variation:'"wdth" 100', maxWidth:boxWidth, maxHeight:bodyBudget,
      startSize:bodyStartSize, minSize:Math.min(Math.round(W*0.0241), bodyStartSize), lineHeightRatio:1.45,
      maxLines: isContentSlide ? 5 : undefined
    });
    const bodyH = s.body ? bodyFit.lines.length * bodyFit.lineHeight : 0;

    const totalH = eyebrowH + (eyebrowH?gap:0) + headlineH + (bodyH?gap:0) + bodyH;
    let y = contentTop;
    if (s.valign === "center") y = contentTop + Math.max(0,(boxHeight-totalH)/2);
    else if (s.valign === "bottom") y = contentBottom - totalH;

    function drawLines(lines, font, lineHeight, variation){
      ctx.font = font;
      try { ctx.fontVariationSettings = variation || "normal"; } catch(e){}
      for (const line of lines){
        let x = boxLeft;
        if (s.halign === "center"){
          const w = ctx.measureText(line).width;
          x = boxLeft + (boxWidth - w)/2;
        }
        ctx.fillText(line, x, y);
        y += lineHeight;
      }
    }

    if (s.eyebrow){
      ctx.fillStyle = s.eyebrowColor || brand.accent;
      try { ctx.letterSpacing = "0.14em"; } catch(e){}
      drawLines([s.eyebrow.toUpperCase()], "700 " + eyebrowSize + "px 'Geist'", eyebrowH);
      try { ctx.letterSpacing = "0px"; } catch(e){}
      y += gap - eyebrowH*0.3;
    }
    ctx.fillStyle = s.textColor;
    drawLines(headlineFit.lines, "900 " + headlineFit.size + "px 'Roboto'", headlineFit.lineHeight, '"wdth" 87.5');
    if (s.body){
      y += gap;
      ctx.fillStyle = s.textColor;
      drawLines(bodyFit.lines, "400 " + bodyFit.size + "px 'Roboto'", bodyFit.lineHeight, '"wdth" 100');
    }

    // watermark + page pill share one vertically-centered footer line
    const showHandleNow = brand.showHandle && brand.handle;
    const showPageNow = brand.showPageNum;
    if (showHandleNow || showPageNow){
      const hs = Math.round(W*0.026);
      const ps = Math.round(W*0.02);
      const padX = ps*0.7, padY = ps*0.55;
      let label = "", pillW = 0, pillH = 0;
      if (showPageNow){
        label = String(index+1).padStart(2,"0") + "/" + String(total).padStart(2,"0");
        ctx.font = "500 " + ps + "px 'IBM Plex Mono'";
        const tw = ctx.measureText(label).width;
        pillW = tw + padX*2; pillH = ps + padY*2;
      }
      const footerH = Math.max(hs, pillH);
      const footerCenterY = boxBottom - footerH/2;

      if (showHandleNow){
        ctx.globalAlpha = 0.9;
        ctx.fillStyle = s.textColor;
        ctx.font = "italic 400 " + hs + "px 'Instrument Serif'";
        try { ctx.fontVariationSettings = "normal"; } catch(e){}
        ctx.fillText(brand.handle, boxLeft, footerCenterY - hs/2);
        ctx.globalAlpha = 1;
      }
      if (showPageNow){
        const px = W - pad - pillW, py = footerCenterY - pillH/2;
        ctx.fillStyle = brand.accent;
        roundRect(ctx, px, py, pillW, pillH, pillH/2);
        ctx.fill();
        ctx.fillStyle = "#ffffff";
        ctx.font = "500 " + ps + "px 'IBM Plex Mono'";
        ctx.fillText(label, px+padX, py+padY*0.9);
      }
    }
  }

  function roundRect(ctx,x,y,w,h,r){
    ctx.beginPath();
    ctx.moveTo(x+r,y);
    ctx.arcTo(x+w,y,x+w,y+h,r);
    ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r);
    ctx.arcTo(x,y,x+w,y,r);
    ctx.closePath();
  }

  let rafId = null;
  function scheduleRender(){
    if (rafId) cancelAnimationFrame(rafId);
    rafId = requestAnimationFrame(() => {
      renderMain();
      redrawThumb(selectedSlide());
      rafId = null;
    });
    scheduleSave();
  }

  function renderMain(){
    const [W,H] = dims();
    mainCanvas.width = W; mainCanvas.height = H;
    const ctx = mainCanvas.getContext("2d");
    const idx = selectedIndex();
    drawSlide(ctx, selectedSlide(), state.brand, W, H, idx, state.slides.length);
    $("dimsReadout").textContent = W + " × " + H + " · slide " + (idx+1) + "/" + state.slides.length;
  }

  function redrawThumb(s){
    const c = thumbCanvases.get(s.id);
    if (!c) return;
    const [W,H] = dims();
    const scale = 220/W;
    c.width = Math.round(W*scale); c.height = Math.round(H*scale);
    const ctx = c.getContext("2d");
    ctx.save(); ctx.scale(scale,scale);
    drawSlide(ctx, s, state.brand, W, H, state.slides.indexOf(s), state.slides.length);
    ctx.restore();
  }

  // continuous redraw while the selected slide has a playing video background
  function previewTick(){
    const s = selectedSlide();
    if (s && s.bg.type === "video" && s.bg.videoEl && !s.bg.videoEl.paused){
      renderMain();
      redrawThumb(s);
    }
    requestAnimationFrame(previewTick);
  }
  requestAnimationFrame(previewTick);

  function createVideoElement(url){
    const v = document.createElement("video");
    v.src = url;
    v.muted = true;
    v.loop = true;
    v.playsInline = true;
    v.autoplay = true;
    $("hiddenVideoHost").appendChild(v);
    v.play().catch(()=>{});
    v.addEventListener("canplay", () => { if (v.paused) v.play().catch(()=>{}); });
    return v;
  }

  function syncVideoPlayback(){
    const selected = selectedSlide();
    state.slides.forEach(s => {
      if (s.bg.type === "video" && s.bg.videoEl){
        if (s === selected) s.bg.videoEl.play().catch(()=>{});
        else s.bg.videoEl.pause();
      }
    });
  }

  function updateExportLabels(){
    const s = selectedSlide();
    const [W,H] = dims();
    $("exportNote").textContent = (s.bg.type === "video" ? "MP4" : "PNG") + " · " + W + " × " + H;
  }

  function buildFilmstrip(){
    const wrap = $("thumbs");
    wrap.innerHTML = "";
    thumbCanvases.clear();
    state.slides.forEach((s, i) => {
      const div = document.createElement("div");
      div.className = "thumb" + (s.id === state.selectedId ? " active" : "");
      const canvas = document.createElement("canvas");
      thumbCanvases.set(s.id, canvas);
      div.appendChild(canvas);

      const idxTag = document.createElement("span");
      idxTag.className = "thumb-index";
      idxTag.textContent = i+1;
      div.appendChild(idxTag);

      const controls = document.createElement("div");
      controls.className = "thumb-controls";
      controls.innerHTML =
        '<button data-act="up" ' + (i===0?"disabled":"") + ' title="Mover para cima">▲</button>' +
        '<button data-act="dup" ' + (state.slides.length>=MAX_SLIDES?"disabled":"") + ' title="Duplicar">⧉</button>' +
        '<button data-act="down" ' + (i===state.slides.length-1?"disabled":"") + ' title="Mover para baixo">▼</button>' +
        '<button data-act="del" ' + (state.slides.length<=MIN_SLIDES?"disabled":"") + ' title="Excluir">✕</button>';
      controls.addEventListener("click", (e) => {
        e.stopPropagation();
        const act = e.target.getAttribute("data-act");
        if (!act) return;
        if (act === "up" && i>0){ swap(i,i-1); }
        else if (act === "down" && i<state.slides.length-1){ swap(i,i+1); }
        else if (act === "dup" && state.slides.length<MAX_SLIDES){ duplicateSlide(s.id); }
        else if (act === "del" && state.slides.length>MIN_SLIDES){ deleteSlide(s.id); }
      });
      div.appendChild(controls);

      div.addEventListener("click", () => selectSlide(s.id));
      wrap.appendChild(div);
      redrawThumb(s);
    });
    $("slideCount").textContent = state.slides.length + " slides";
    $("exportCount").textContent = state.slides.length;
    $("slideCountSel").value = String(state.slides.length);
    $("addSlide").disabled = state.slides.length >= MAX_SLIDES;
    buildDots();
  }

  function buildDots(){
    const dotsWrap = $("dots");
    dotsWrap.innerHTML = "";
    state.slides.forEach((s) => {
      const b = document.createElement("button");
      b.className = "dot" + (s.id === state.selectedId ? " active" : "");
      b.addEventListener("click", () => selectSlide(s.id));
      dotsWrap.appendChild(b);
    });
  }

  function swap(i,j){
    const arr = state.slides;
    [arr[i],arr[j]] = [arr[j],arr[i]];
    buildFilmstrip(); renderMain(); scheduleSave();
  }

  function duplicateSlide(id){
    const i = state.slides.findIndex(s=>s.id===id);
    const copy = JSON.parse(JSON.stringify(state.slides[i]));
    copy.id = uid();
    copy.bg.img = state.slides[i].bg.img || null;
    copy.bg.videoEl = state.slides[i].bg.videoUrl ? createVideoElement(state.slides[i].bg.videoUrl) : null;
    state.slides.splice(i+1,0,copy);
    state.selectedId = copy.id;
    buildFilmstrip(); syncEditor(); renderMain(); scheduleSave();
  }

  function deleteSlide(id){
    const i = state.slides.findIndex(s=>s.id===id);
    if (state.slides[i].bg.videoEl){ state.slides[i].bg.videoEl.pause(); state.slides[i].bg.videoEl.remove(); }
    state.slides.splice(i,1);
    if (state.selectedId === id) state.selectedId = state.slides[Math.max(0,i-1)].id;
    buildFilmstrip(); syncEditor(); renderMain(); scheduleSave();
  }

  function addSlide(){
    if (state.slides.length >= MAX_SLIDES) return;
    const n = slide({ headline:"Novo título", body:"Escreva o texto deste slide.",
      bg:{ type:"solid", color1:"#f2efe6", color2:state.brand.accent, image:null, img:null }, textColor:"#17161b" });
    state.slides.push(n);
    state.selectedId = n.id;
    buildFilmstrip(); syncEditor(); renderMain(); scheduleSave();
  }

  function setSlideCount(n){
    n = Math.max(MIN_SLIDES, Math.min(MAX_SLIDES, n));
    while (state.slides.length < n){
      state.slides.push(slide({ headline:"Novo título", body:"Escreva o texto deste slide.",
        bg:{ type:"solid", color1:"#f2efe6", color2:state.brand.accent, image:null, img:null }, textColor:"#17161b" }));
    }
    while (state.slides.length > n){
      const removed = state.slides.pop();
      if (state.selectedId === removed.id) state.selectedId = state.slides[state.slides.length-1].id;
    }
    buildFilmstrip(); syncEditor(); renderMain(); scheduleSave();
  }

  function roleLabel(i,total){
    if (i===0) return "capa";
    if (i===total-1) return "fechamento";
    return "conteúdo";
  }

  function syncEditor(){
    const s = selectedSlide();
    const i = selectedIndex();
    $("editorTitle").textContent = "Slide " + (i+1);
    $("roleTag").textContent = roleLabel(i, state.slides.length);
    $("slideShowLogo").checked = s.showLogo !== false;
    $("valignSel").value = s.valign;
    $("halignSel").value = s.halign;
    $("eyebrowInput").value = s.eyebrow;
    $("eyebrowColorInput").value = s.eyebrowColor || state.brand.accent;
    $("headlineInput").value = s.headline;
    $("bodyInput").value = s.body;
    const headlineSize = s.headlineSize != null ? s.headlineSize : 84;
    const bodySize = s.bodySize != null ? s.bodySize : 30;
    $("headlineSize").value = headlineSize;
    $("headlineSizeValue").textContent = headlineSize + "px";
    $("bodySize").value = bodySize;
    $("bodySizeValue").textContent = bodySize + "px";
    $("bgType").value = s.bg.type;
    $("bgColor1").value = s.bg.color1;
    $("bgColor2").value = s.bg.color2;
    $("textColor").value = s.textColor;
    const isImage = s.bg.type === "image", isVideo = s.bg.type === "video";
    $("color2Field").style.display = s.bg.type === "gradient" ? "flex" : "none";
    $("imageField").style.display = isImage ? "flex" : "none";
    $("videoField").style.display = isVideo ? "flex" : "none";
    $("serverUrlField").style.display = isVideo ? "flex" : "none";
    $("overlayField").style.display = (isImage || isVideo) ? "flex" : "none";
    $("cropField").style.display = (isImage || isVideo) ? "flex" : "none";
    $("color1Field").style.display = (isImage || isVideo) ? "none" : "flex";
    $("videoStatus").textContent = s.bg.videoName ? s.bg.videoName : "";
    const overlay = s.bg.imageOverlay != null ? s.bg.imageOverlay : 40;
    $("bgOverlay").value = overlay;
    $("overlayValue").textContent = overlay + "%";
    const zoomPct = Math.round((s.bg.zoom != null ? s.bg.zoom : 1) * 100);
    $("bgZoom").value = zoomPct;
    $("bgZoomValue").textContent = zoomPct + "%";
    updateCropAffordance(s);
    syncVideoPlayback();
    updateExportLabels();
    buildDots();
    buildMediaGallery();
  }

  function updateCropAffordance(s){
    const draggable = bgDraggable(s);
    mainCanvas.style.cursor = draggable ? "grab" : "default";
    $("cropHint").style.display = draggable ? "block" : "none";
  }

  function selectSlide(id){
    state.selectedId = id;
    buildFilmstrip(); syncEditor(); renderMain(); scheduleSave();
  }

  // ---- field bindings ----
  function bindField(id, evt, handler){ $(id).addEventListener(evt, handler); }

  bindField("slideShowLogo","change", e => { selectedSlide().showLogo = e.target.checked; scheduleRender(); });
  bindField("valignSel","change", e => { selectedSlide().valign = e.target.value; scheduleRender(); });
  bindField("halignSel","change", e => { selectedSlide().halign = e.target.value; scheduleRender(); });
  bindField("eyebrowInput","input", e => { selectedSlide().eyebrow = e.target.value; scheduleRender(); });
  bindField("eyebrowColorInput","input", e => { selectedSlide().eyebrowColor = e.target.value; scheduleRender(); });
  bindField("headlineInput","input", e => { selectedSlide().headline = e.target.value; scheduleRender(); });
  bindField("bodyInput","input", e => { selectedSlide().body = e.target.value; scheduleRender(); });
  bindField("headlineSize","input", e => {
    selectedSlide().headlineSize = Number(e.target.value);
    $("headlineSizeValue").textContent = e.target.value + "px";
    scheduleRender();
  });
  bindField("bodySize","input", e => {
    selectedSlide().bodySize = Number(e.target.value);
    $("bodySizeValue").textContent = e.target.value + "px";
    scheduleRender();
  });
  $("resetHeadlineSize").addEventListener("click", () => {
    selectedSlide().headlineSize = 84;
    $("headlineSize").value = 84;
    $("headlineSizeValue").textContent = "84px";
    scheduleRender(); scheduleSave();
  });
  $("resetBodySize").addEventListener("click", () => {
    selectedSlide().bodySize = 30;
    $("bodySize").value = 30;
    $("bodySizeValue").textContent = "30px";
    scheduleRender(); scheduleSave();
  });
  bindField("textColor","input", e => { selectedSlide().textColor = e.target.value; scheduleRender(); });
  bindField("bgColor1","input", e => { selectedSlide().bg.color1 = e.target.value; scheduleRender(); });
  bindField("bgColor2","input", e => { selectedSlide().bg.color2 = e.target.value; scheduleRender(); });
  bindField("bgType","change", e => {
    const s = selectedSlide();
    s.bg.type = e.target.value;
    const isImage = e.target.value === "image", isVideo = e.target.value === "video";
    $("color2Field").style.display = e.target.value === "gradient" ? "flex" : "none";
    $("imageField").style.display = isImage ? "flex" : "none";
    $("videoField").style.display = isVideo ? "flex" : "none";
    $("serverUrlField").style.display = isVideo ? "flex" : "none";
    $("overlayField").style.display = (isImage || isVideo) ? "flex" : "none";
    $("cropField").style.display = (isImage || isVideo) ? "flex" : "none";
    $("color1Field").style.display = (isImage || isVideo) ? "none" : "flex";
    updateCropAffordance(s);
    syncVideoPlayback();
    updateExportLabels();
    buildMediaGallery();
    scheduleRender();
  });
  bindField("bgOverlay","input", e => {
    selectedSlide().bg.imageOverlay = Number(e.target.value);
    $("overlayValue").textContent = e.target.value + "%";
    scheduleRender();
  });
  bindField("bgZoom","input", e => {
    const s = selectedSlide();
    s.bg.zoom = Number(e.target.value) / 100;
    $("bgZoomValue").textContent = e.target.value + "%";
    updateCropAffordance(s);
    scheduleRender();
  });
  $("resetCrop").addEventListener("click", () => {
    const s = selectedSlide();
    s.bg.cropX = 0.5; s.bg.cropY = 0.5; s.bg.zoom = 1;
    $("bgZoom").value = 100;
    $("bgZoomValue").textContent = "100%";
    scheduleRender(); scheduleSave();
  });

  // drag-to-reposition the background image or video directly on the live preview
  function bgMedia(s){
    if (s.bg.type === "video") return s.bg.videoEl;
    if (s.bg.type === "image") return s.bg.img;
    return null;
  }
  function bgMediaSize(s){
    const m = bgMedia(s);
    if (!m) return null;
    if (s.bg.type === "video"){
      if (!(m.readyState >= 2 && m.videoWidth)) return null;
      return [m.videoWidth, m.videoHeight];
    }
    if (!(m.complete && m.naturalWidth)) return null;
    return [m.naturalWidth, m.naturalHeight];
  }
  function bgDraggable(s){
    return s.bg.type === "image" || s.bg.type === "video";
  }
  let cropDrag = null;
  mainCanvas.addEventListener("pointerdown", e => {
    const s = selectedSlide();
    if (!bgDraggable(s) || !bgMediaSize(s)) return;
    const rect = mainCanvas.getBoundingClientRect();
    cropDrag = { pointerId: e.pointerId, lastX: e.clientX, lastY: e.clientY, scale: mainCanvas.width / rect.width };
    mainCanvas.setPointerCapture(e.pointerId);
    mainCanvas.style.cursor = "grabbing";
    e.preventDefault();
  });
  mainCanvas.addEventListener("pointermove", e => {
    if (!cropDrag || e.pointerId !== cropDrag.pointerId) return;
    const s = selectedSlide();
    const size = bgMediaSize(s);
    if (!size) return;
    const dxClient = e.clientX - cropDrag.lastX;
    const dyClient = e.clientY - cropDrag.lastY;
    cropDrag.lastX = e.clientX; cropDrag.lastY = e.clientY;
    const [W,H] = dims();
    const [iw, ih] = size;
    const zoom = s.bg.zoom != null ? s.bg.zoom : 1;
    const mediaScale = Math.max(W/iw, H/ih) * zoom;
    const dw = iw*mediaScale, dh = ih*mediaScale;
    const overflowX = dw - W, overflowY = dh - H;
    const dxCanvas = dxClient * cropDrag.scale, dyCanvas = dyClient * cropDrag.scale;
    let cropX = s.bg.cropX != null ? s.bg.cropX : 0.5;
    let cropY = s.bg.cropY != null ? s.bg.cropY : 0.5;
    if (overflowX > 0) cropX = Math.min(1, Math.max(0, cropX - dxCanvas/overflowX));
    if (overflowY > 0) cropY = Math.min(1, Math.max(0, cropY - dyCanvas/overflowY));
    s.bg.cropX = cropX; s.bg.cropY = cropY;
    scheduleRender();
  });
  function endCropDrag(e){
    if (cropDrag && (!e || e.pointerId === cropDrag.pointerId)){
      cropDrag = null;
      const s = selectedSlide();
      mainCanvas.style.cursor = bgDraggable(s) ? "grab" : "default";
      scheduleSave();
    }
  }
  mainCanvas.addEventListener("pointerup", endCropDrag);
  mainCanvas.addEventListener("pointercancel", endCropDrag);
  function buildMediaGallery(){
    const el = $("mediaPool");
    if (!el) return;
    const s = selectedSlide();
    el.innerHTML = "";
    state.mediaPool.forEach(item => {
      const div = document.createElement("div");
      div.className = "media-pool-item" + (s.bg.type === "image" && s.bg.poolId === item.id ? " active" : "");
      div.title = item.name || "";
      const img = document.createElement("img");
      img.src = item.dataUrl;
      img.alt = item.name || "";
      div.appendChild(img);
      div.addEventListener("click", () => applyPoolImageToSelectedSlide(item));
      const rm = document.createElement("button");
      rm.type = "button"; rm.textContent = "✕"; rm.title = "Remover do banco";
      rm.addEventListener("click", (ev) => { ev.stopPropagation(); removePoolImage(item.id); });
      div.appendChild(rm);
      el.appendChild(div);
    });
  }

  function applyPoolImageToSelectedSlide(item){
    const s = selectedSlide();
    s.bg.image = item.dataUrl;
    s.bg.img = item.img;
    s.bg.poolId = item.id;
    scheduleRender(); scheduleSave();
    buildMediaGallery();
  }

  function removePoolImage(id){
    state.mediaPool = state.mediaPool.filter(p => p.id !== id);
    buildMediaGallery();
    scheduleSave();
  }

  async function addFilesToPool(fileList){
    const files = Array.from(fileList || []);
    if (!files.length) return;
    const results = [];
    for (const file of files){
      try {
        const { dataUrl, img } = await compressImageFile(file);
        results.push({ id: uid(), name: file.name, dataUrl, img });
      } catch(e){
        toastMsg("Não foi possível processar " + file.name);
      }
    }
    if (!results.length) return;
    state.mediaPool.push(...results);
    const s = selectedSlide();
    s.bg.image = results[0].dataUrl;
    s.bg.img = results[0].img;
    s.bg.poolId = results[0].id;
    scheduleRender();
    buildMediaGallery();
    scheduleSave();
  }

  bindField("bgImage","change", e => {
    addFilesToPool(e.target.files);
    e.target.value = ""; // permite selecionar os mesmos arquivos de novo depois
  });
  bindField("bgVideo","change", e => {
    const file = e.target.files[0];
    if (!file) return;
    const s = selectedSlide();
    if (s.bg.videoEl){ s.bg.videoEl.pause(); s.bg.videoEl.remove(); }
    if (s.bg.videoUrl) URL.revokeObjectURL(s.bg.videoUrl);
    const url = URL.createObjectURL(file);
    s.bg.videoUrl = url;
    s.bg.videoName = file.name;
    s.bg.videoEl = createVideoElement(url);
    s.bg.videoEl.addEventListener("loadedmetadata", () => scheduleRender());
    $("videoStatus").textContent = file.name;
    scheduleRender(); scheduleSave();
  });
  bindField("serverUrlInput","input", e => setServerUrl(e.target.value));

  $("addSlide").addEventListener("click", addSlide);
  $("slideCountSel").addEventListener("change", e => setSlideCount(Number(e.target.value)));
  $("prevSlide").addEventListener("click", () => {
    const i = selectedIndex();
    selectSlide(state.slides[(i-1+state.slides.length)%state.slides.length].id);
  });
  $("nextSlide").addEventListener("click", () => {
    const i = selectedIndex();
    selectSlide(state.slides[(i+1)%state.slides.length].id);
  });

  $("formatSeg").addEventListener("click", (e) => {
    const btn = e.target.closest("button[data-format]");
    if (!btn) return;
    state.format = btn.getAttribute("data-format");
    [...$("formatSeg").children].forEach(b => b.classList.toggle("active", b===btn));
    updateExportLabels();
    buildFilmstrip(); renderMain(); scheduleSave();
  });

  $("projectName").addEventListener("input", scheduleSave);

  $("resetBtn").addEventListener("click", async () => {
    const ok = await confirmDialog("Isso apaga o rascunho salvo neste navegador e recomeça do exemplo. Continuar?");
    if (!ok) return;
    await clearDraft();
    location.reload();
  });

  $("handleInput").addEventListener("input", e => { state.brand.handle = e.target.value; scheduleRender(); });
  $("accentInput").addEventListener("input", e => { state.brand.accent = e.target.value; scheduleRender(); });
  $("showHandle").addEventListener("change", e => { state.brand.showHandle = e.target.checked; scheduleRender(); });
  $("showPageNum").addEventListener("change", e => { state.brand.showPageNum = e.target.checked; scheduleRender(); });
  $("showLogo").addEventListener("change", e => { state.brand.showLogo = e.target.checked; scheduleRender(); });
  $("logoPosSel").addEventListener("change", e => { state.brand.logoPos = e.target.value; scheduleRender(); });

  $("logoSelect").addEventListener("change", e => {
    state.brand.logo.mode = e.target.value;
    scheduleRender(); scheduleSave();
  });

  function preloadLogos(){
    ["preto","branco"].forEach(variant => {
      const img = new Image();
      img.onload = () => { buildFilmstrip(); renderMain(); };
      img.onerror = () => { toastMsg("Não foi possível carregar o logo " + variant); };
      img.src = logoDataUrl(LOGO_OPTIONS[variant]);
      state.brand.logo.imgs[variant] = img;
    });
  }

  // ---- export ----
  function downloadBlob(filename, blob){
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
  }

  function slug(str){
    return (str||"carrossel").toLowerCase()
      .normalize("NFD").replace(/[\u0300-\u036f]/g,"")
      .replace(/[^a-z0-9]+/g,"-").replace(/(^-|-$)/g,"") || "carrossel";
  }

  function toastMsg(msg){
    const t = $("toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(toastMsg._t);
    toastMsg._t = setTimeout(() => t.classList.remove("show"), 2400);
  }

  function setExportProgress(msg){
    $("exportProgress").textContent = msg || "";
  }

  // ---- video export: record the canvas with MediaRecorder (webm), then
  // convert to MP4 with ffmpeg.wasm (loaded from CDN on first use) ----
  // Talks directly to the ffmpeg.wasm worker protocol instead of the @ffmpeg/ffmpeg
  // wrapper class: that class always creates its worker with {type:"module"} when
  // given a custom classWorkerURL, but the UMD worker chunk relies on importScripts()
  // (classic-worker only), so the two are incompatible. A plain classic Worker built
  // from a blob of that same script (to dodge the cross-origin Worker() restriction)
  // works fine — the block below just speaks its {id,type,data} message format.
  let ffmpegWorkerPromise = null;
  function getFFmpeg(){
    if (ffmpegWorkerPromise) return ffmpegWorkerPromise;
    ffmpegWorkerPromise = (async () => {
      if (!window.FFmpegUtil) throw new Error("Conversor de vídeo não carregou (sem conexão?)");
      const { toBlobURL } = FFmpegUtil;
      setExportProgress("Carregando conversor de vídeo (só na primeira vez)…");
      const workerBlobUrl = await toBlobURL("https://unpkg.com/@ffmpeg/ffmpeg@0.12.10/dist/umd/814.ffmpeg.js", "text/javascript");
      const worker = new Worker(workerBlobUrl);
      let msgId = 0;
      const pending = new Map();
      worker.onmessage = (e) => {
        const { id, type, data } = e.data;
        if (type === "LOG") return;
        if (type === "PROGRESS"){
          setExportProgress("Convertendo para MP4… " + Math.min(100, Math.round((data.progress||0)*100)) + "%");
          return;
        }
        const cb = pending.get(id);
        if (!cb) return;
        pending.delete(id);
        if (type === "ERROR") cb.reject(new Error(data));
        else cb.resolve(data);
      };
      worker.onerror = () => {
        for (const cb of pending.values()) cb.reject(new Error("Falha no conversor de vídeo"));
        pending.clear();
      };
      function send(type, data, transfer){
        return new Promise((resolve, reject) => {
          const id = ++msgId;
          pending.set(id, { resolve, reject });
          worker.postMessage({ id, type, data }, transfer || []);
        });
      }
      const base = "https://unpkg.com/@ffmpeg/core@0.12.6/dist/umd";
      await send("LOAD", { coreURL: base + "/ffmpeg-core.js", wasmURL: base + "/ffmpeg-core.wasm" });
      return {
        exec: (args) => send("EXEC", { args, timeout: -1 }),
        writeFile: (path, data) => send("WRITE_FILE", { path, data }),
        readFile: (path) => send("READ_FILE", { path }),
        deleteFile: (path) => send("DELETE_FILE", { path })
      };
    })();
    return ffmpegWorkerPromise;
  }

  function pickWebmMime(){
    const candidates = ["video/webm;codecs=vp9", "video/webm;codecs=vp8", "video/webm"];
    for (const c of candidates){
      if (window.MediaRecorder && MediaRecorder.isTypeSupported(c)) return c;
    }
    return "";
  }

  async function recordSlideWebm(index){
    const s = state.slides[index];
    const videoEl = s.bg.videoEl;
    if (!videoEl || !videoEl.duration) throw new Error("Vídeo de fundo não carregado");
    const [W,H] = dims();
    exportCanvas.width = W; exportCanvas.height = H;
    const ctx = exportCanvas.getContext("2d");

    const wasLoop = videoEl.loop;
    const wasTime = videoEl.currentTime;
    videoEl.loop = false;
    videoEl.currentTime = 0;
    await new Promise(res => { videoEl.onseeked = res; });

    const stream = exportCanvas.captureStream(30);
    const mime = pickWebmMime();
    if (!mime) throw new Error("Este navegador não sabe gravar vídeo");
    const recorder = new MediaRecorder(stream, { mimeType: mime });
    const chunks = [];
    recorder.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
    const stopped = new Promise((resolve, reject) => {
      recorder.onstop = resolve;
      recorder.onerror = reject;
    });

    setExportProgress("Gravando vídeo…");
    recorder.start();
    await videoEl.play();
    const startTime = performance.now();
    const durationMs = videoEl.duration * 1000;

    let stopping = false;
    const tickTimer = setInterval(() => {
      if (stopping) return;
      drawSlide(ctx, s, state.brand, W, H, index, state.slides.length);
      const elapsed = performance.now() - startTime;
      if (elapsed >= durationMs || videoEl.ended){
        stopping = true;
        clearInterval(tickTimer);
        videoEl.pause();
        recorder.stop();
      }
    }, 33);
    await stopped;

    videoEl.loop = wasLoop;
    videoEl.currentTime = wasTime;
    if (wasLoop) videoEl.play().catch(()=>{});

    return new Blob(chunks, { type: "video/webm" });
  }

  async function convertWithFFmpegWasm(webmBlob){
    const { fetchFile } = FFmpegUtil;
    const ffmpeg = await getFFmpeg();
    await ffmpeg.writeFile("input.webm", await fetchFile(webmBlob));
    await ffmpeg.exec(["-i", "input.webm", "-c:v", "libx264", "-pix_fmt", "yuv420p", "-r", "30", "-fps_mode", "cfr", "-movflags", "+faststart", "output.mp4"]);
    const data = await ffmpeg.readFile("output.mp4");
    try { await ffmpeg.deleteFile("input.webm"); await ffmpeg.deleteFile("output.mp4"); } catch(e){}
    return new Blob([data.buffer], { type: "video/mp4" });
  }

  async function convertViaServer(webmBlob, serverUrl){
    const formData = new FormData();
    formData.append("video", webmBlob, "input.webm");
    const resp = await fetch(serverUrl + "/convert", { method: "POST", body: formData });
    if (!resp.ok){
      let msg = "erro " + resp.status;
      try { const j = await resp.json(); if (j && j.error) msg = j.error; } catch(e){}
      throw new Error(msg);
    }
    return await resp.blob();
  }

  async function convertWebmToMp4(webmBlob){
    const serverUrl = getServerUrl();
    if (serverUrl){
      setExportProgress("Convertendo no servidor…");
      try {
        return await convertViaServer(webmBlob, serverUrl);
      } catch(err){
        toastMsg("Servidor de conversão falhou (" + err.message + ") — convertendo no navegador");
      }
    }
    setExportProgress("Convertendo no navegador…");
    return await convertWithFFmpegWasm(webmBlob);
  }

  async function exportVideoSlideAt(index){
    const webmBlob = await recordSlideWebm(index);
    const mp4Blob = await convertWebmToMp4(webmBlob);
    setExportProgress("");
    const filename = slug($("projectName").value) + "-" + String(index+1).padStart(2,"0") + ".mp4";
    return { filename, blob: mp4Blob };
  }

  async function exportSlideAt(index){
    const s = state.slides[index];
    if (s.bg.type === "video"){
      return await exportVideoSlideAt(index);
    }
    const [W,H] = dims();
    exportCanvas.width = W; exportCanvas.height = H;
    const ctx = exportCanvas.getContext("2d");
    drawSlide(ctx, s, state.brand, W, H, index, state.slides.length);
    const blob = await new Promise(res => exportCanvas.toBlob(res, "image/png"));
    const filename = slug($("projectName").value) + "-" + String(index+1).padStart(2,"0") + ".png";
    return { filename, blob };
  }

  $("exportOne").addEventListener("click", async () => {
    $("exportOne").disabled = true; $("exportAll").disabled = true;
    try {
      const { filename, blob } = await exportSlideAt(selectedIndex());
      downloadBlob(filename, blob);
      toastMsg("Slide exportado");
    } catch(err){
      toastMsg("Não foi possível exportar: " + (err && err.message ? err.message : "erro"));
    } finally {
      setExportProgress("");
      $("exportOne").disabled = false; $("exportAll").disabled = false;
    }
  });

  $("exportAll").addEventListener("click", async () => {
    if (!window.JSZip){
      toastMsg("Não foi possível montar o zip (biblioteca não carregou)");
      return;
    }
    $("exportOne").disabled = true; $("exportAll").disabled = true;
    const zip = new JSZip();
    let ok = 0;
    for (let i=0;i<state.slides.length;i++){
      try {
        setExportProgress("Exportando slide " + (i+1) + " de " + state.slides.length + "…");
        const { filename, blob } = await exportSlideAt(i);
        zip.file(filename, blob);
        ok++;
        await new Promise(r => setTimeout(r, 200));
      } catch(err){
        toastMsg("Falhou no slide " + (i+1) + ": " + (err && err.message ? err.message : "erro"));
        break;
      }
    }
    if (ok === state.slides.length){
      setExportProgress("Compactando arquivos…");
      const zipBlob = await zip.generateAsync({ type: "blob" });
      const zipName = slug($("projectName").value) + ".zip";
      downloadBlob(zipName, zipBlob);
      toastMsg("Carrossel exportado (" + ok + " itens em " + zipName + ")");
    }
    setExportProgress("");
    $("exportOne").disabled = false; $("exportAll").disabled = false;
  });

  // ---- init ----
  function applyDraft(draft){
    state.format = draft.format === "1:1" ? "1:1" : "4:5";
    const logoMode = draft.brand.logoMode || "auto";
    state.brand = Object.assign(state.brand, draft.brand, {
      logoPos: draft.brand.logoPos || "left"
    });
    state.brand.logo.mode = logoMode;
    state.slides = draft.slides;
    state.selectedId = state.slides.some(s => s.id === draft.selectedId)
      ? draft.selectedId : state.slides[0].id;
    state.mediaPool = draft.mediaPool || [];

    if (draft.projectName) $("projectName").value = draft.projectName;
    $("handleInput").value = state.brand.handle;
    $("accentInput").value = state.brand.accent;
    $("showHandle").checked = state.brand.showHandle;
    $("showPageNum").checked = state.brand.showPageNum;
    $("showLogo").checked = state.brand.showLogo;
    $("logoPosSel").value = state.brand.logoPos;
    $("logoSelect").value = state.brand.logo.mode;
    [...$("formatSeg").children].forEach(b => b.classList.toggle("active", b.getAttribute("data-format") === state.format));
    updateExportLabels();
    $("saveStatus").textContent = "rascunho restaurado";
    if (draft._hadVideo) toastMsg("Vídeos de fundo não ficam salvos no rascunho — envie de novo onde precisar");
  }

  async function init(){
    preloadLogos();
    let rawServerUrl = null;
    try { rawServerUrl = localStorage.getItem(SERVER_URL_KEY); } catch(e){}
    if (rawServerUrl != null) $("serverUrlInput").value = rawServerUrl;
    else setServerUrl($("serverUrlInput").value);
    const draft = await loadDraft();
    if (draft) applyDraft(draft);

    if (document.fonts && document.fonts.ready){
      document.fonts.load("700 40px 'Fraunces'");
      document.fonts.load("400 20px 'IBM Plex Sans'");
      document.fonts.load("500 16px 'IBM Plex Mono'");
      document.fonts.load("700 40px 'Geist'");
      document.fonts.load("900 40px 'Roboto'");
      document.fonts.load("400 20px 'Roboto'");
      document.fonts.load("italic 400 30px 'Instrument Serif'");
      document.fonts.ready.then(() => { buildFilmstrip(); renderMain(); });
    }
    buildFilmstrip();
    syncEditor();
    renderMain();
  }
  init();
})();
</script>
